<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TRAZA//CO2 · CRM</title>
<meta name="description" content="CRM de consultoría TRAZA//CO2: trazabilidad de carbono y logística 5.0" />
<meta name="theme-color" content="#022c22" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "lucide-react": "https://esm.sh/lucide-react@0.451.0?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body class="bg-emerald-950">
<div id="root">
  <div style="color:#d6d3d1;font-family:sans-serif;padding:40px;text-align:center">
    Cargando CRM TRAZA//CO2… (requiere conexión a internet la primera vez)
  </div>
</div>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useMemo, useState } from 'react'
import ReactDOM from 'react-dom/client'
import {
LayoutDashboard, Users, GitBranch, Calculator, FileText, Scale, Plug,
Bell, Search, Leaf, TrendingDown, AlertTriangle, CheckCircle2, Plus,
ArrowRight, ArrowLeft, Printer, RefreshCw, TreePine, Car, Home,
Mail, Phone, MapPin, ShieldCheck, Database, Wifi, Target, Sprout,
Building2, Zap, Globe, Download
} from 'lucide-react'
import {
ResponsiveContainer, ComposedChart, Bar, Line, XAxis, YAxis, CartesianGrid,
Tooltip, Legend, PieChart, Pie, Cell
} from 'recharts'

// ============ MARCA ============
function LogoIcon({ size = 42 }) {
return (
  <svg width={size} height={size} viewBox="0 0 64 64" fill="none">
    <path d="M9 15V9H34" stroke="#D2622A" strokeWidth="5" strokeLinecap="square" />
    <path d="M9 49V55H34" stroke="#D2622A" strokeWidth="5" strokeLinecap="square" />
    <rect x="15" y="17" width="7" height="30" rx="1" fill="#1F8A70" />
    <rect x="26" y="12" width="7" height="40" rx="1" fill="#1F8A70" />
    <rect x="37" y="22" width="7" height="18" rx="1" fill="#1F8A70" />
    <rect x="49" y="26" width="6" height="6" rx="1" fill="#1F8A70" />
    <rect x="49" y="36" width="6" height="6" rx="1" fill="#1F8A70" />
  </svg>
)
}
function Logo({ compact = false }) {
return (
  <div className="flex items-center gap-2">
    <LogoIcon size={compact ? 34 : 42} />
    <div className="leading-none">
      <div className="text-2xl font-black tracking-tight text-stone-100">
        TRAZA<span className="text-teal-400">//</span>CO<sub className="text-sm">2</sub>
      </div>
      {!compact && (
        <div className="text-xs font-bold text-orange-500 mt-1 tracking-widest">
          WMS · TRAZABILIDAD CARBONO · LOGÍSTICA 5.0
        </div>
      )}
    </div>
  </div>
)
}

// ============ UTILIDADES ============
const fmt = (n, d = 0) =>
(isNaN(n) ? 0 : n).toLocaleString('es-ES', { maximumFractionDigits: d })

const FACTORES = {
diesel: 2.68, gasolina: 2.31, gasNatural: 2.02,
electricidad: 0.17, freight: 0.062, aereo: 0.115
}
const EQ = { arbol: 21.7, cocheKm: 0.12, hogar: 2000 }

// ============ DATOS SEMILLA ============
const TIPOS = ['Auditoría Flota Eléctrica', 'Última Milla Multimodal', 'Ingeniería de Empaques', 'Logística Inversa']
const STAGES = ['Prospecto', 'Calificación', 'Propuesta', 'Negociación', 'Ganado']
const COLORS = { 'Auditoría Flota Eléctrica': '#14b8a6', 'Última Milla Multimodal': '#f59e0b', 'Ingeniería de Empaques': '#84cc16', 'Logística Inversa': '#38bdf8' }

const CLIENTES0 = [
{ id: 1, nombre: 'Iberlogix Transportes', sector: 'Transporte', ciudad: 'Madrid', empleados: 210, flotaDiesel: true, iso14001: true, objetivo: 'Net Zero 2050', baseline: { dieselL: 180000, gasolinaL: 12000, gasNatM3: 0, elecKWh: 420000, freightTkm: 9500000, aereoPkm: 120000 } },
{ id: 2, nombre: 'EcoRetail España', sector: 'Gran Distribución', ciudad: 'Barcelona', empleados: 320, flotaDiesel: true, iso14001: true, objetivo: 'Net Zero 2030', baseline: { dieselL: 60000, gasolinaL: 4000, gasNatM3: 0, elecKWh: 1800000, freightTkm: 3200000, aereoPkm: 300000 } },
{ id: 3, nombre: 'Química Delta', sector: 'Industria', ciudad: 'Tarragona', empleados: 150, flotaDiesel: false, iso14001: false, objetivo: 'Reducción 2030', baseline: { dieselL: 8000, gasolinaL: 0, gasNatM3: 900000, elecKWh: 2600000, freightTkm: 900000, aereoPkm: 40000 } },
{ id: 4, nombre: 'Distribuciones Norte', sector: 'Distribución', ciudad: 'Bilbao', empleados: 80, flotaDiesel: true, iso14001: false, objetivo: 'ZBE 2026', baseline: { dieselL: 45000, gasolinaL: 6000, gasNatM3: 0, elecKWh: 180000, freightTkm: 1400000, aereoPkm: 20000 } },
{ id: 5, nombre: 'AgroSur Cooperativa', sector: 'Agroalimentario', ciudad: 'Valencia', empleados: 120, flotaDiesel: true, iso14001: true, objetivo: 'Huella 2030', baseline: { dieselL: 70000, gasolinaL: 0, gasNatM3: 120000, elecKWh: 350000, freightTkm: 2100000, aereoPkm: 0 } },
{ id: 6, nombre: 'FastPharma Logística', sector: 'Farmacéutico', ciudad: 'Zaragoza', empleados: 95, flotaDiesel: false, iso14001: true, objetivo: 'Net Zero 2040', baseline: { dieselL: 15000, gasolinaL: 0, gasNatM3: 40000, elecKWh: 900000, freightTkm: 800000, aereoPkm: 90000 } }
]

const DEALS0 = [
{ id: 1, cliente: 'Iberlogix Transportes', tipo: 'Auditoría Flota Eléctrica', stage: 'Propuesta', valor: 18500, score: 88, co2: 320 },
{ id: 2, cliente: 'Distribuciones Norte', tipo: 'Última Milla Multimodal', stage: 'Calificación', valor: 12000, score: 74, co2: 140 },
{ id: 3, cliente: 'EcoRetail España', tipo: 'Ingeniería de Empaques', stage: 'Prospecto', valor: 9500, score: 55, co2: 60 },
{ id: 4, cliente: 'FastPharma Logística', tipo: 'Logística Inversa', stage: 'Negociación', valor: 15800, score: 81, co2: 95 },
{ id: 5, cliente: 'EcoRetail España', tipo: 'Auditoría Flota Eléctrica', stage: 'Ganado', valor: 21000, score: 90, co2: 410 },
{ id: 6, cliente: 'AgroSur Cooperativa', tipo: 'Última Milla Multimodal', stage: 'Ganado', valor: 8900, score: 68, co2: 75 },
{ id: 7, cliente: 'Química Delta', tipo: 'Ingeniería de Empaques', stage: 'Ganado', valor: 11200, score: 62, co2: 48 },
{ id: 8, cliente: 'Distribuciones Norte', tipo: 'Logística Inversa', stage: 'Prospecto', valor: 7400, score: 45, co2: 30 }
]

const DOCS0 = [
{ cliente: 'Iberlogix Transportes', tipo: 'ISO 14001', cad: '2026-03-15' },
{ cliente: 'Iberlogix Transportes', tipo: 'Huella de Carbono MITECO', cad: '2025-11-30' },
{ cliente: 'EcoRetail España', tipo: 'ISO 50001', cad: '2026-06-01' },
{ cliente: 'Química Delta', tipo: 'Auditoría Energética', cad: '2025-10-12' },
{ cliente: 'AgroSur Cooperativa', tipo: 'ISO 14001', cad: '2027-01-20' },
{ cliente: 'FastPharma Logística', tipo: 'ISO 14001', cad: '2026-09-05' }
]

const MONTHLY = [
{ m: 'Ene', ingresos: 12.4, co2: 95 }, { m: 'Feb', ingresos: 9.8, co2: 70 },
{ m: 'Mar', ingresos: 18.2, co2: 160 }, { m: 'Abr', ingresos: 15.5, co2: 130 },
{ m: 'May', ingresos: 21.0, co2: 205 }, { m: 'Jun', ingresos: 17.3, co2: 150 },
{ m: 'Jul', ingresos: 24.6, co2: 240 }, { m: 'Ago', ingresos: 19.1, co2: 185 }
]

const SLA = [
{ proyecto: 'Iberlogix · Ruta Verde', prometido: 18, real: 21 },
{ proyecto: 'EcoRetail · Última Milla', prometido: 12, real: 9 },
{ proyecto: 'AgroSur · Flota 2024', prometido: 8, real: 11 },
{ proyecto: 'Química Delta · Empaques', prometido: 15, real: 15 }
]

const Panel = ({ children, className = '' }) => (
<div className={'rounded-xl border border-emerald-800 bg-emerald-900/60 p-4 ' + className}>{children}</div>
)
const Chip = ({ children, tone = 'teal' }) => {
const tones = {
  teal: 'bg-teal-500/20 text-teal-300 border-teal-500/40',
  orange: 'bg-orange-500/20 text-orange-300 border-orange-500/40',
  lime: 'bg-lime-500/20 text-lime-300 border-lime-500/40',
  red: 'bg-red-500/20 text-red-300 border-red-500/40',
  slate: 'bg-slate-500/20 text-slate-300 border-slate-500/40'
}
return <span className={'px-2 py-0.5 rounded-full border text-xs font-semibold ' + tones[tone]}>{children}</span>
}
const ScoreBar = ({ v }) => (
<div className="flex items-center gap-2">
  <div className="h-2 w-16 rounded bg-emerald-950 overflow-hidden">
    <div className={'h-full ' + (v >= 75 ? 'bg-lime-400' : v >= 55 ? 'bg-amber-400' : 'bg-red-400')} style={{ width: v + '%' }} />
  </div>
  <span className="text-xs text-stone-300">{v}</span>
</div>
)

// ============ APP ============
function App() {
const [view, setView] = useState('dashboard')
const [clientes, setClientes] = useState(CLIENTES0)
const [deals, setDeals] = useState(DEALS0)
const [docs, setDocs] = useState(DOCS0)
const [search, setSearch] = useState('')
const [factoresV, setFactoresV] = useState('MITECO 2024 · GHG Protocol v1.3')

const alertas = useMemo(() => {
  const a = []
  clientes.forEach(c => {
    if (c.flotaDiesel && ['Madrid', 'Barcelona'].includes(c.ciudad))
      a.push({ sev: 'alta', ico: AlertTriangle, txt: `${c.nombre}: flota diésel operando en zona ${c.ciudad} (ZBE) — exige plan de electrificación o restricciones en 2026.` })
    if (c.empleados >= 250)
      a.push({ sev: 'alta', ico: FileText, txt: `${c.nombre}: supera 250 empleados → obligada a reporte CSRD (informe de sostenibilidad corporativa).` })
    if (c.flotaDiesel && c.empleados < 250)
      a.push({ sev: 'media', ico: Car, txt: `${c.nombre}: revisión normativa Euro 6/7 en flota diésel para rutas interurbanas.` })
    if (!c.iso14001)
      a.push({ sev: 'media', ico: ShieldCheck, txt: `${c.nombre}: sin ISO 14001 — oportunidad de venta de auditoría + certificación.` })
  })
  return a
}, [clientes])

const nav = [
  ['dashboard', 'Dashboard', LayoutDashboard],
  ['clientes', 'Clientes Eco', Users],
  ['pipeline', 'Pipeline', GitBranch],
  ['calculadora', 'Huella CO₂', Calculator],
  ['propuestas', 'Propuestas CPQ', FileText],
  ['legal', 'Legal y Normas', Scale],
  ['integraciones', 'Integraciones', Plug]
]

return (
  <div className="min-h-screen bg-emerald-950 text-stone-100 flex flex-col">
    <header className="flex items-center gap-4 px-5 py-3 border-b border-emerald-800 bg-emerald-900/80 sticky top-0 z-20">
      <Logo compact />
      <div className="ml-6 hidden lg:block">
        <div className="text-sm font-semibold">Miguel Ángel Layunta López</div>
        <div className="text-xs text-teal-300">Fundador &amp; Consultor Senior · Logística 5.0</div>
      </div>
      <div className="ml-auto flex items-center gap-3">
        <div className="relative hidden md:block">
          <Search className="w-4 h-4 absolute left-2 top-2 text-stone-400" />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar cliente, proyecto…"
            className="bg-emerald-950 border border-emerald-800 rounded-lg pl-8 pr-3 py-1.5 text-sm w-64 focus:outline-none focus:border-teal-500 text-stone-100" />
        </div>
        <button onClick={() => setView('legal')} className="relative p-2 rounded-lg hover:bg-emerald-800">
          <Bell className="w-5 h-5 text-teal-300" />
          <span className="absolute -top-0.5 -right-0.5 bg-orange-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center font-bold">{alertas.length}</span>
        </button>
      </div>
    </header>

    <div className="flex flex-1 overflow-hidden">
      <aside className="w-56 shrink-0 border-r border-emerald-800 bg-emerald-900/40 p-3 hidden sm:block">
        {nav.map(([id, label, Icon]) => (
          <button key={id} onClick={() => setView(id)}
            className={'w-full flex items-center gap-3 px-3 py-2.5 rounded-lg mb-1 text-sm font-medium transition ' +
              (view === id ? 'bg-teal-600 text-white' : 'text-stone-300 hover:bg-emerald-800')}>
            <Icon className="w-4 h-4" /> {label}
          </button>
        ))}
        <div className="mt-6 rounded-lg bg-emerald-950 border border-emerald-800 p-3 text-xs text-stone-400">
          <Leaf className="w-4 h-4 text-lime-400 mb-1" />
          CRM sostenible · v1.0<br />mlayuntalopez@gmail.com<br />698 910 833
        </div>
      </aside>

      <main className="flex-1 overflow-y-auto p-5">
        {view === 'dashboard' && <Dashboard deals={deals} clientes={clientes} alertas={alertas} />}
        {view === 'clientes' && <Clientes clientes={clientes} setClientes={setClientes} deals={deals} search={search} />}
        {view === 'pipeline' && <Pipeline deals={deals} setDeals={setDeals} clientes={clientes} search={search} />}
        {view === 'calculadora' && <Calculadora clientes={clientes} />}
        {view === 'propuestas' && <Propuestas deals={deals} setDeals={setDeals} clientes={clientes} />}
        {view === 'legal' && <Legal clientes={clientes} docs={docs} setDocs={setDocs} alertas={alertas} />}
        {view === 'integraciones' && <Integraciones factoresV={factoresV} setFactoresV={setFactoresV} />}
      </main>
    </div>
  </div>
)
}

// ============ 1. DASHBOARD ============
function Dashboard({ deals, clientes, alertas }) {
const won = deals.filter(d => d.stage === 'Ganado')
const open = deals.filter(d => d.stage !== 'Ganado')
const kpis = [
  { t: 'Pipeline abierto', v: '€ ' + fmt(open.reduce((s, d) => s + d.valor, 0)), i: Target, c: 'text-teal-300' },
  { t: 'Ingresos ganados', v: '€ ' + fmt(won.reduce((s, d) => s + d.valor, 0)), i: CheckCircle2, c: 'text-lime-300' },
  { t: 'tCO₂e mitigadas (compromiso)', v: fmt(won.reduce((s, d) => s + d.co2, 0)) + ' t', i: TrendingDown, c: 'text-orange-300' },
  { t: 'ROE · tCO₂e / 1.000 €', v: (won.reduce((s, d) => s + d.co2, 0) / Math.max(1, won.reduce((s, d) => s + d.valor, 0)) * 1000).toFixed(1), i: Sprout, c: 'text-sky-300' }
]
const porTipo = TIPOS.map(t => ({ name: t, value: deals.filter(d => d.tipo === t).length }))
return (
  <div className="space-y-5">
    <h2 className="text-xl font-bold">Cuadro de Mando · Negocio y Sostenibilidad</h2>
    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      {kpis.map((k, i) => (
        <Panel key={i} className="flex items-center gap-3">
          <k.i className={'w-8 h-8 ' + k.c} />
          <div>
            <div className="text-xs text-stone-400">{k.t}</div>
            <div className="text-xl font-bold">{k.v}</div>
          </div>
        </Panel>
      ))}
    </div>

    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <Panel className="lg:col-span-2">
        <div className="text-sm font-semibold mb-2 text-teal-300">Ingresos (miles €) vs tCO₂e mitigadas</div>
        <div className="h-64">
          <ResponsiveContainer>
            <ComposedChart data={MONTHLY}>
              <CartesianGrid stroke="#064e3b" />
              <XAxis dataKey="m" stroke="#94a3b8" fontSize={12} />
              <YAxis stroke="#94a3b8" fontSize={12} />
              <Tooltip contentStyle={{ background: '#022c22', border: '1px solid #065f46', borderRadius: 8 }} />
              <Legend />
              <Bar dataKey="ingresos" name="Ingresos k€" fill="#14b8a6" radius={[4, 4, 0, 0]} />
              <Line dataKey="co2" name="tCO₂e evitadas" stroke="#f59e0b" strokeWidth={3} dot={{ fill: '#f59e0b' }} />
            </ComposedChart>
          </ResponsiveContainer>
        </div>
      </Panel>
      <Panel>
        <div className="text-sm font-semibold mb-2 text-teal-300">Pipeline por tipo de proyecto</div>
        <div className="h-64">
          <ResponsiveContainer>
            <PieChart>
              <Pie data={porTipo} dataKey="value" nameKey="name" innerRadius={45} outerRadius={80} paddingAngle={3}>
                {porTipo.map(e => <Cell key={e.name} fill={COLORS[e.name]} />)}
              </Pie>
              <Tooltip contentStyle={{ background: '#022c22', border: '1px solid #065f46', borderRadius: 8 }} />
            </PieChart>
          </ResponsiveContainer>
        </div>
        <div className="space-y-1 mt-2">
          {porTipo.map(p => (
            <div key={p.name} className="flex items-center gap-2 text-xs text-stone-300">
              <span className="w-3 h-3 rounded-full" style={{ background: COLORS[p.name] }} /> {p.name} ({p.value})
            </div>
          ))}
        </div>
      </Panel>
    </div>

    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <Panel>
        <div className="text-sm font-semibold mb-3 text-teal-300">SLA Verdes · Objetivo prometido vs. real</div>
        <table className="w-full text-sm">
          <thead><tr className="text-left text-stone-400 text-xs border-b border-emerald-800">
            <th className="py-2">Proyecto</th><th>Prometido</th><th>Real</th><th>Estado</th></tr></thead>
          <tbody>
            {SLA.map(s => (
              <tr key={s.proyecto} className="border-b border-emerald-900/60">
                <td className="py-2">{s.proyecto}</td>
                <td>-{s.prometido}%</td>
                <td>-{s.real}%</td>
                <td>{s.real >= s.prometido ? <Chip tone="lime">En objetivo</Chip> : <Chip tone="red">Riesgo</Chip>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </Panel>
      <Panel>
        <div className="text-sm font-semibold mb-3 text-teal-300">Alertas regulatorias activas ({alertas.length})</div>
        <div className="space-y-2">
          {alertas.slice(0, 4).map((a, i) => (
            <div key={i} className="flex gap-2 items-start text-xs bg-emerald-950/60 rounded-lg p-2 border border-emerald-800">
              <a.ico className={'w-4 h-4 shrink-0 mt-0.5 ' + (a.sev === 'alta' ? 'text-red-400' : 'text-amber-400')} />
              <span className="text-stone-300">{a.txt}</span>
            </div>
          ))}
        </div>
      </Panel>
    </div>
  </div>
)
}

// ============ 2. CLIENTES ============
function Clientes({ clientes, setClientes, deals, search }) {
const [sel, setSel] = useState(1)
const [nuevo, setNuevo] = useState(false)
const [f, setF] = useState({ nombre: '', ciudad: 'Madrid', sector: 'Transporte', empleados: 50, objetivo: 'Net Zero 2030' })
const list = clientes.filter(c => c.nombre.toLowerCase().includes(search.toLowerCase()))
const c = clientes.find(x => x.id === sel) || list[0]
const tBase = (c ? (c.baseline.dieselL * FACTORES.diesel + c.baseline.gasolinaL * FACTORES.gasolina + c.baseline.gasNatM3 * FACTORES.gasNatural + c.baseline.elecKWh * FACTORES.electricidad + c.baseline.freightTkm * FACTORES.freight + c.baseline.aereoPkm * FACTORES.aereo) / 1000 : 0)

return (
  <div className="space-y-4">
    <div className="flex items-center justify-between">
      <h2 className="text-xl font-bold">Fichas de Cliente Eco-Segmentadas</h2>
      <button onClick={() => setNuevo(!nuevo)} className="flex items-center gap-2 bg-teal-600 hover:bg-teal-500 px-3 py-2 rounded-lg text-sm font-semibold">
        <Plus className="w-4 h-4" /> Nuevo cliente
      </button>
    </div>
    {nuevo && (
      <Panel className="grid grid-cols-2 md:grid-cols-5 gap-3 items-end">
        {[['Nombre', 'nombre'], ['Ciudad', 'ciudad'], ['Sector', 'sector']].map(([lab, k]) => (
          <label key={k} className="text-xs text-stone-400">{lab}
            <input className="mt-1 w-full bg-emerald-950 border border-emerald-800 rounded-lg px-2 py-1.5 text-sm text-stone-100"
              value={f[k]} onChange={e => setF({ ...f, [k]: e.target.value })} />
          </label>
        ))}
        <label className="text-xs text-stone-400">Empleados
          <input type="number" className="mt-1 w-full bg-emerald-950 border border-emerald-800 rounded-lg px-2 py-1.5 text-sm text-stone-100"
            value={f.empleados} onChange={e => setF({ ...f, empleados: +e.target.value })} />
        </label>
        <button onClick={() => {
          setClientes([...clientes, { ...f, id: Date.now(), flotaDiesel: true, iso14001: false, baseline: { dieselL: 20000, gasolinaL: 0, gasNatM3: 0, elecKWh: 100000, freightTkm: 500000, aereoPkm: 0 } }])
          setNuevo(false)
        }} className="bg-lime-600 hover:bg-lime-500 rounded-lg px-3 py-2 text-sm font-bold text-emerald-950">Guardar ficha</button>
      </Panel>
    )}

    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div className="space-y-2">
        {list.map(cl => (
          <button key={cl.id} onClick={() => setSel(cl.id)}
            className={'w-full text-left rounded-xl border p-3 transition ' + (c && cl.id === c.id ? 'border-teal-500 bg-teal-600/20' : 'border-emerald-800 bg-emerald-900/50 hover:bg-emerald-800/60')}>
            <div className="flex items-center justify-between">
              <span className="font-semibold text-sm">{cl.nombre}</span>
              <Chip tone={cl.objetivo.includes('2030') ? 'lime' : 'teal'}>{cl.objetivo}</Chip>
            </div>
            <div className="text-xs text-stone-400 mt-1 flex items-center gap-3">
              <span className="flex items-center gap-1"><MapPin className="w-3 h-3" />{cl.ciudad}</span>
              <span>{cl.sector}</span><span>{cl.empleados} emp.</span>
            </div>

      {c && (

                <span className="flex items-center gap-1"><Building2 className="w-3 h-3" />{c.sector}</span>
                <span>{c.empleados} empleados</span>

            <div className="flex gap-2">
              {c.iso14001 && <Chip tone="teal">ISO 14001</Chip>}
              <Chip tone="orange">{c.objetivo}</Chip>
            </div>
          </div>
          <div className="grid grid-cols-3 gap-3 mt-4">
            <div className="rounded-lg bg-emerald-950 border border-emerald-800 p-3 text-center">

          <div className="space-y-2 text-xs">

              ['Alcance 2 · Electricidad', c.baseline.elecKWh * FACTORES.electricidad / 1000],

                <div className="flex justify-between text-stone-300"><span>{lab}</span><span>{fmt(v, 1)} t</span></div>
                <div className="h-2 rounded bg-emerald-950 mt-1">
                  <div className="h-full rounded bg-gradient-to-r from-teal-500 to-lime-400" style={{ width: Math.min(100, v / Math.max(1, tBase) * 100) + '%' }} />
                </div>
              </div>
            ))}
          </div>
        </Panel>
      )}
    </div>
  </div>
)
}

// ============ 3. PIPELINE ============
function Pipeline({ deals, setDeals, clientes, search }) {
const [filtro, setFiltro] = useState('Todos')
const [nuevo, setNuevo] = useState({ cliente: clientes[0].nombre, tipo: TIPOS[0], valor: 10000, score: 60, co2: 100 })
const list = deals.filter(d =>
  (filtro === 'Todos' || d.tipo === filtro) &&
  d.cliente.toLowerCase().includes(search.toLowerCase()))
const mover = (id, dir) => {
  setDeals(deals.map(d => {
    if (d.id !== id) return d
    const i = STAGES.indexOf(d.stage) + dir
    return i < 0 || i >= STAGES.length ? d : { ...d, stage: STAGES[i] }
  }))
}
return (
  <div className="space-y-4">
    <div className="flex flex-wrap items-center gap-2 justify-between">
      <h2 className="text-xl font-bold">Pipeline de Consultoría</h2>
      <div className="flex gap-2 flex-wrap">
        {['Todos', ...TIPOS].map(t => (
          <button key={t} onClick={() => setFiltro(t)}
            className={'px-3 py-1.5 rounded-full text-xs font-semibold border ' + (filtro === t ? 'bg-teal-600 border-teal-500 text-white' : 'border-emerald-800 text-stone-300 hover:bg-emerald-800')}>
            {t}
          </button>
        ))}
      </div>
    </div>

    <Panel className="flex flex-wrap gap-3 items-end">
      <label className="text-xs text-stone-400">Cliente
        <select className="mt-1 block bg-emerald-950 border border-emerald-800 rounded-lg px-2 py-1.5 text-sm text-stone-100" value={nuevo.cliente} onChange={e => setNuevo({ ...nuevo, cliente: e.target.value })}>
          {clientes.map(c => <option key={c.id}>{c.nombre}</option>)}
        </select></label>
      <label className="text-xs text-stone-400">Tipo de proyecto
        <select className="mt-1 block bg-emerald-950 border border-emerald-800 rounded-lg px-2 py-1.5 text-sm text-stone-100" value={nuevo.tipo} onChange={e => setNuevo({ ...nuevo, tipo: e.target.value })}>
          {TIPOS.map(t => <option key={t}>{t}</option>)}
        </select></label>
      <label className="text-xs text-stone-400">Valor €
        <input type="number" className="mt-1 block bg-emerald-950 border border-emerald-800 rounded-lg px-2 py-1.5 text-sm w-28 text-stone-100" value={nuevo.valor} onChange={e => setNuevo({ ...nuevo, valor: +e.target.value })} /></label>
      <label className="text-xs text-stone-400">Score verde
        <input type="number" className="mt-1 block bg-emerald-950 border border-emerald-800 rounded-lg px-2 py-1.5 text-sm w-20 text-stone-100" value={nuevo.score} onChange={e => setNuevo({ ...nuevo, score: +e.target.value })} /></label>
      <label className="text-xs text-stone-400">tCO₂e objetivo
        <input type="number" className="mt-1 block bg-emerald-950 border border-emerald-800 rounded-lg px-2 py-1.5 text-sm w-24 text-stone-100" value={nuevo.co2} onChange={e => setNuevo({ ...nuevo, co2: +e.target.value })} /></label>
      <button onClick={() => setDeals([...deals, { id: Date.now(), stage: 'Prospecto', ...nuevo }])}
        className="flex items-center gap-1 bg-lime-600 hover:bg-lime-500 text-emerald-950 font-bold text-sm px-3 py-2 rounded-lg"><Plus className="w-4 h-4" />Añadir</button>
    </Panel>

    <div className="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-5 gap-3">
      {STAGES.map(st => {
        const col = list.filter(d => d.stage === st)
        return (
          <div key={st} className="rounded-xl border border-emerald-800 bg-emerald-900/40 p-2">
            <div className="flex justify-between items-center px-1 py-1">
              <span className="text-xs font-bold uppercase tracking-wide text-teal-300">{st}</span>
              <span className="text-xs text-stone-400">€{fmt(col.reduce((s, d) => s + d.valor, 0))}</span>
            </div>
            <div className="space-y-2 mt-1">
              {col.map(d => (
                <div key={d.id} className="rounded-lg border border-emerald-800 bg-emerald-950 p-2.5 text-xs">
                  <div className="font-semibold text-sm">{d.cliente}</div>
                  <div className="flex items-center gap-1.5 mt-1">
                    <span className="w-2 h-2 rounded-full" style={{ background: COLORS[d.tipo] }} />
                    <span className="text-stone-400">{d.tipo}</span>
                  </div>
                  <div className="flex justify-between mt-2">
                    <span className="font-bold text-lime-300">€{fmt(d.valor)}</span>
                    <span className="text-orange-300">-{fmt(d.co2)} tCO₂e</span>
                  </div>
                  <div className="mt-1"><ScoreBar v={d.score} /></div>
                  <div className="flex justify-between mt-2">
                    <button onClick={() => mover(d.id, -1)} className="p-1 rounded hover:bg-emerald-800"><ArrowLeft className="w-3.5 h-3.5" /></button>
                    <button onClick={() => mover(d.id, 1)} className="p-1 rounded hover:bg-emerald-800"><ArrowRight className="w-3.5 h-3.5" /></button>
                  </div>
                </div>
              ))}
              {col.length === 0 && <div className="text-xs text-stone-500 text-center py-4">Sin oportunidades</div>}
            </div>
          </div>
        )
      })}
    </div>
  </div>
)
}

// ============ 4. CALCULADORA ============
function Calculadora({ clientes }) {
const [before, setB] = useState({ dieselL: 180000, gasolinaL: 12000, gasNatM3: 0, elecKWh: 420000, freightTkm: 9500000, aereoPkm: 120000 })
const [pct, setPct] = useState({ s1: 15, s2: 20, s3: 12 })
const [conv, setConv] = useState(150)

const calc = (b, p) => {
  const s1 = (b.dieselL * FACTORES.diesel + b.gasolinaL * FACTORES.gasolina + b.gasNatM3 * FACTORES.gasNatural) / 1000
  const s2 = (b.elecKWh * FACTORES.electricidad) / 1000
  const s3 = (b.freightTkm * FACTORES.freight + b.aereoPkm * FACTORES.aereo) / 1000
  return { s1: s1 * (1 - p.s1 / 100), s2: s2 * (1 - p.s2 / 100), s3: s3 * (1 - p.s3 / 100) }
}
const a = calc(before, { s1: 0, s2: 0, s3: 0 })
const d = calc(before, pct)
const totA = a.s1 + a.s2 + a.s3, totD = d.s1 + d.s2 + d.s3
const evitadas = Math.max(0, totA - totD)

const campos = [
  ['dieselL', 'Diésel (L/año)'], ['gasolinaL', 'Gasolina (L/año)'], ['gasNatM3', 'Gas natural (m³/año)'],
  ['elecKWh', 'Electricidad (kWh/año)'], ['freightTkm', 'Mercancías (t·km/año)'], ['aereoPkm', 'Viajes aéreos (pax·km/año)']
]
return (
  <div className="space-y-4">
    <h2 className="text-xl font-bold">Calculadora de Huella de Carbono · Alcances 1, 2 y 3</h2>
    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <Panel>
        <div className="flex items-center justify-between mb-3">
          <span className="text-sm font-semibold text-teal-300">Consumos del cliente (Situación actual)</span>
          <select className="bg-emerald-950 border border-emerald-800 rounded-lg px-2 py-1 text-xs text-stone-100"
            onChange={e => { const c = clientes.find(x => x.nombre === e.target.value); if (c) setB(c.baseline) }} defaultValue="">
            <option value="" disabled>Cargar baseline de cliente…</option>
            {clientes.map(c => <option key={c.id}>{c.nombre}</option>)}
          </select>
        </div>
        <div className="grid grid-cols-2 gap-3">
          {campos.map(([k, lab]) => (
            <label key={k} className="text-xs text-stone-400">{lab}
              <input type="number" className="mt-1 w-full bg-emerald-950 border border-emerald-800 rounded-lg px-2 py-1.5 text-sm text-stone-100"
                value={before[k]} onChange={e => setB({ ...before, [k]: +e.target.value })} />
            </label>
          ))}
        </div>
        <div className="mt-4 text-sm font-semibold text-teal-300 mb-2">Palancas de reducción (escenario post-consultoría)</div>
        {[['s1', 'Alcance 1 · Flota y combustibles'], ['s2', 'Alcance 2 · Electricidad'], ['s3', 'Alcance 3 · Cadena de valor']].map(([k, lab]) => (
          <div key={k} className="flex items-center gap-3 mb-2 text-xs text-stone-300">
            <span className="w-48">{lab}</span>
            <input type="range" min="0" max="40" value={pct[k]} onChange={e => setPct({ ...pct, [k]: +e.target.value })} className="flex-1 accent-teal-500" />
            <span className="w-10 text-right font-bold text-lime-300">-{pct[k]}%</span>
          </div>
        ))}
      </Panel>

      <div className="space-y-4">
        <Panel>
          <div className="text-sm font-semibold text-teal-300 mb-3">Resultado · Antes vs. Después</div>
          <div className="grid grid-cols-3 gap-3 text-center">
            <div className="rounded-lg bg-emerald-950 border border-emerald-800 p-3">
              <div className="text-2xl font-black text-stone-200">{fmt(totA)}</div>
              <div className="text-xs text-stone-400">tCO₂e ANTES</div>
            </div>
            <div className="rounded-lg bg-emerald-950 border border-emerald-800 p-3">
              <div className="text-2xl font-black text-teal-300">{fmt(totD)}</div>
              <div className="text-xs text-stone-400">tCO₂e DESPUÉS</div>
            </div>
            <div className="rounded-lg bg-orange-500/10 border border-orange-500/40 p-3">
              <div className="text-2xl font-black text-orange-300">-{fmt(evitadas)}</div>
              <div className="text-xs text-stone-400">tCO₂e EVITADAS</div>
            </div>
          </div>
          <div className="mt-3 space-y-1 text-xs text-stone-300">
            {[['Alcance 1', a.s1, d.s1], ['Alcance 2', a.s2, d.s2], ['Alcance 3', a.s3, d.s3]].map(([lab, x, y]) => (
              <div key={lab} className="flex justify-between border-b border-emerald-900/60 py-1">
                <span>{lab}</span><span>{fmt(x, 1)} → <b className="text-lime-300">{fmt(y, 1)} t</b></span>
              </div>
            ))}
          </div>
        </Panel>

        <Panel>
          <div className="text-sm font-semibold text-teal-300 mb-2 flex items-center gap-2"><Sprout className="w-4 h-4 text-lime-400" />Conversor de métricas verdes</div>
          <div className="flex items-center gap-2 mb-3">
            <span className="text-xs text-stone-400">tCO₂e a traducir:</span>
            <input type="number" value={conv} onChange={e => setConv(+e.target.value)} className="bg-emerald-950 border border-emerald-800 rounded-lg px-2 py-1 text-sm w-24 text-stone-100" />
            <button onClick={() => setConv(Math.round(evitadas))} className="text-xs bg-teal-600 rounded-lg px-2 py-1">Usar resultado ↑</button>
          </div>
          <div className="grid grid-cols-3 gap-3 text-center">
            <div className="rounded-lg bg-lime-500/10 border border-lime-500/30 p-3">
              <TreePine className="w-6 h-6 mx-auto text-lime-400" />
              <div className="text-xl font-black text-lime-300">{fmt(conv * 1000 / EQ.arbol)}</div>
              <div className="text-xs text-stone-400">árboles/año equivalentes</div>
            </div>
            <div className="rounded-lg bg-sky-500/10 border border-sky-500/30 p-3">
              <Car className="w-6 h-6 mx-auto text-sky-400" />
              <div className="text-xl font-black text-sky-300">{fmt(conv * 1000 / EQ.cocheKm / 1000)}k</div>
              <div className="text-xs text-stone-400">km en coche de combustión</div>
            </div>
            <div className="rounded-lg bg-orange-500/10 border border-orange-500/30 p-3">
              <Home className="w-6 h-6 mx-auto text-orange-400" />
              <div className="text-xl font-black text-orange-300">{fmt(conv * 1000 / EQ.hogar)}</div>
              <div className="text-xs text-stone-400">hogares anuales</div>
            </div>
          </div>
        </Panel>
      </div>
    </div>
  </div>
)
}

// ============ 5. PROPUESTAS CPQ ============
function Propuestas({ deals, setDeals, clientes }) {
const abiertos = deals.filter(d => d.stage !== 'Ganado')
const [selId, setSelId] = useState(abiertos[0]?.id || deals[0].id)
const deal = deals.find(d => d.id === selId) || deals[0]
const [desc, setDesc] = useState(5)
const [ahorro, setAhorro] = useState(38000)
const cliente = clientes.find(c => c.nombre === deal.cliente)
const precio = deal.valor * (1 - desc / 100)
const valorCarbono = deal.co2 * 30
const roi = ((ahorro * 3 - precio) / precio * 100)
const roe = (deal.co2 / (precio / 1000)).toFixed(1)

return (
  <div className="space-y-4">
    <h2 className="text-xl font-bold">Configurador de Propuestas Comerciales (CPQ)</h2>
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <Panel>
        <div className="text-sm font-semibold text-teal-300 mb-3">Oportunidad</div>
        <select className="w-full bg-emerald-950 border border-emerald-800 rounded-lg px-2 py-2 text-sm mb-3 text-stone-100" value={deal.id} onChange={e => setSelId(+e.target.value)}>
          {deals.map(d => <option key={d.id} value={d.id}>{d.cliente} · {d.tipo}</option>)}
        </select>
        <label className="text-xs text-stone-400 block mb-3">Honorarios base: <b className="text-stone-100">€{fmt(deal.valor)}</b></label>
        <label className="text-xs text-stone-400 block mb-1">Descuento: {desc}%</label>
        <input type="range" min="0" max="20" value={desc} onChange={e => setDesc(+e.target.value)} className="w-full accent-orange-500 mb-3" />
        <label className="text-xs text-stone-400">Ahorro energético anual estimado para el cliente (€)
          <input type="number" className="mt-1 w-full bg-emerald-950 border border-emerald-800 rounded-lg px-2 py-1.5 text-sm text-stone-100" value={ahorro} onChange={e => setAhorro(+e.target.value)} />
        </label>
        <div className="mt-4 space-y-1 text-sm">
          <div className="flex justify-between"><span className="text-stone-400">Precio final</span><b>€{fmt(precio)}</b></div>
          <div className="flex justify-between"><span className="text-stone-400">Valor del carbono evitado</span><b className="text-orange-300">€{fmt(valorCarbono)}</b></div>
          <div className="flex justify-between"><span className="text-stone-400">ROI cliente (3 años)</span><b className="text-lime-300">{fmt(roi)}%</b></div>
          <div className="flex justify-between"><span className="text-stone-400">ROE (tCO₂e/1.000€)</span><b className="text-teal-300">{roe}</b></div>
        </div>
        <button onClick={() => setDeals(deals.map(d => d.id === deal.id ? { ...d, stage: 'Propuesta' } : d))}
          className="w-full mt-4 bg-teal-600 hover:bg-teal-500 rounded-lg py-2 text-sm font-bold flex items-center justify-center gap-2">
          <CheckCircle2 className="w-4 h-4" />Enviar y mover a «Propuesta»
        </button>
      </Panel>

      <Panel className="lg:col-span-2 bg-stone-100 text-stone-900">
        <div className="flex items-center justify-between border-b border-stone-300 pb-3">
          <div className="flex items-center gap-2">
            <LogoIcon size={40} />
            <div>
              <div className="text-xl font-black">TRAZA<span className="text-teal-600">//</span>CO<sub>2</sub></div>
              <div className="text-xs font-bold text-orange-600">WMS · SISTEMAS DE TRAZABILIDAD CARBONO</div>
            </div>
          </div>
          <button onClick={() => window.print()} className="flex items-center gap-1 text-xs bg-emerald-900 text-white rounded-lg px-3 py-2"><Printer className="w-3.5 h-3.5" />Imprimir / PDF</button>
        </div>
        <h3 className="text-lg font-bold mt-4">Propuesta Técnico-Económica</h3>
        <p className="text-sm text-stone-600">Ref. {new Date().getFullYear()}-{String(deal.id).padStart(3, '0')} · {deal.tipo} · {cliente?.ciudad || ''}</p>
        <div className="grid grid-cols-2 gap-4 mt-4 text-sm">
          <div><b>Cliente:</b> {deal.cliente}<br /><b>Objetivo:</b> {cliente?.objetivo || '—'}<br /><b>Empleados:</b> {cliente?.empleados || '—'}</div>
          <div><b>Consultor responsable:</b><br />Miguel Ángel Layunta López<br /><b>Contacto:</b> mlayuntalopez@gmail.com · 698 910 833</div>
        </div>
        <table className="w-full mt-4 text-sm border-collapse">
          <thead><tr className="bg-emerald-900 text-white">
            <th className="p-2 text-left">KPI</th><th className="p-2 text-left">Antes</th><th className="p-2 text-left">Después (objetivo)</th></tr></thead>
          <tbody>
            <tr className="border-b border-stone-300"><td className="p-2">Emisiones atribuibles</td><td className="p-2">{fmt(cliente ? (cliente.baseline.dieselL * 2.68 + cliente.baseline.elecKWh * 0.17 + cliente.baseline.freightTkm * 0.062) / 1000 : 0)} tCO₂e</td><td className="p-2 text-teal-700 font-bold">-{fmt(deal.co2)} tCO₂e</td></tr>

          </tbody>
        </table>
        <p className="text-xs text-stone-500 mt-4 leading-relaxed">
          Alcance: auditoría, ingeniería de rutas y plan de descarbonización alineado con GHG Protocol y factores de emisión MITECO. Validez de la oferta: 30 días. Factores de emisión actualizados automáticamente vía API ({deal.co2} tCO₂e garantizadas en SLA verde).
        </p>
      </Panel>
    </div>
  </div>
)
}

// ============ 6. LEGAL ============
function Legal({ clientes, docs, setDocs, alertas }) {
const hoy = new Date('2025-09-01')
const estadoDoc = cad => {
  const dias = (new Date(cad) - hoy) / 86400000
  return dias < 0 ? ['Vencido', 'red'] : dias < 120 ? ['Próximo a vencer', 'orange'] : ['Vigente', 'lime']
}
return (
  <div className="space-y-4">
    <h2 className="text-xl font-bold">Cumplimiento Normativo, Auditoría y Certificaciones</h2>
    <Panel>
      <div className="text-sm font-semibold text-teal-300 mb-3 flex items-center gap-2"><AlertTriangle className="w-4 h-4 text-orange-400" />Alertas regulatorias automáticas (cruce ubicación × sector × flota)</div>
      <div className="space-y-2">
        {alertas.map((a, i) => (
          <div key={i} className="flex gap-3 items-start rounded-lg border border-emerald-800 bg-emerald-950/60 p-3">
            <a.ico className={'w-5 h-5 shrink-0 ' + (a.sev === 'alta' ? 'text-red-400' : 'text-amber-400')} />
            <div className="flex-1 text-sm text-stone-200">{a.txt}</div>

    <Panel>
      <div className="flex items-center justify-between mb-3">
        <span className="text-sm font-semibold text-teal-300 flex items-center gap-2"><ShieldCheck className="w-4 h-4 text-lime-400" />Repositorio de certificaciones</span>

      </div>
      <table className="w-full text-sm">
        <thead><tr className="text-left text-xs text-stone-400 border-b border-emerald-800"><th className="py-2">Cliente</th><th>Tipo</th><th>Caducidad</th><th>Estado</th><th></th></tr></thead>
        <tbody>
          {docs.map((d, i) => {
            const [lab, tone] = estadoDoc(d.cad)
            return (
              <tr key={i} className="border-b border-emerald-900/60">
                <td className="py-2">{d.cliente}</td><td>{d.tipo}</td>
                <td>{new Date(d.cad).toLocaleDateString('es-ES')}</td>
                <td><Chip tone={tone}>{lab}</Chip></td>
                <td><Download className="w-4 h-4 text-stone-400" /></td>
              </tr>
            )
          })}
        </tbody>
      </table>
    </Panel>
  </div>
)
}

// ============ 7. INTEGRACIONES ============
function Integraciones({ factoresV, setFactoresV }) {
const [conns, setConns] = useState([
  { n: 'ERP · SAP Business One', d: 'Órdenes de compra, centros de coste y facturación de clientes.', icon: Database, on: true, sync: '2025-08-28 09:14' },
  { n: 'TMS · Gestión de Transporte', d: 'Rutas, carga y kilómetros reales de flota de tus clientes.', icon: Globe, on: true, sync: '2025-08-30 07:02' },
  { n: 'IoT / Telemetría de flota', d: 'Consumo instantáneo de combustible y conducción eficiente.', icon: Zap, on: false, sync: '—' },
  { n: 'Datos satelitales', d: 'Geolocalización de rutas y trazabilidad de alcance 3.', icon: Wifi, on: false, sync: '—' },
  { n: 'Factores MITECO / GHG Protocol', d: 'Actualización automática de algoritmos de cálculo.', icon: Leaf, on: true, sync: '2025-08-01 00:00' }
])
const sync = i => setConns(conns.map((c, j) => {
  if (j !== i) return c
  if (c.n.includes('MITECO')) setFactoresV('MITECO 2025 · GHG Protocol v1.3 (hoy)')
  return { ...c, sync: new Date().toLocaleString('es-ES') }
}))
return (
  <div className="space-y-4">
    <h2 className="text-xl font-bold">Ecosistema Tecnológico · APIs abiertas</h2>
    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
      {conns.map((c, i) => (
        <Panel key={c.n} className="flex gap-3">
          <c.icon className={'w-8 h-8 shrink-0 ' + (c.on ? 'text-lime-400' : 'text-stone-500')} />
          <div className="flex-1">
            <div className="flex items-center justify-between">
              <span className="font-semibold text-sm">{c.n}</span>
              <Chip tone={c.on ? 'lime' : 'slate'}>{c.on ? 'Conectado' : 'Desconectado'}</Chip>
            </div>
            <p className="text-xs text-stone-400 mt-1">{c.d}</p>
            <div className="text-xs text-stone-500 mt-2">Última sincronización: {c.sync}</div>
            <div className="flex gap-2 mt-2">
              <button onClick={() => setConns(conns.map((x, j) => j === i ? { ...x, on: !x.on } : x))}
                className={'text-xs px-3 py-1.5 rounded-lg font-semibold ' + (c.on ? 'bg-red-500/20 text-red-300 border border-red-500/40' : 'bg-lime-500/20 text-lime-300 border border-lime-500/40')}>
                {c.on ? 'Desconectar' : 'Conectar'}
              </button>
              {c.on && <button onClick={() => sync(i)} className="text-xs px-3 py-1.5 rounded-lg font-semibold bg-teal-600 hover:bg-teal-500 flex items-center gap-1"><RefreshCw className="w-3 h-3" />Sincronizar</button>}
            </div>
          </div>
        </Panel>
      ))}
    </div>
    <Panel className="flex items-center gap-3">
      <Leaf className="w-5 h-5 text-lime-400" />
      <div className="text-sm">
        <span className="text-stone-400">Motor de cálculo activo:</span> <b className="text-teal-300">{factoresV}</b>
        <div className="text-xs text-stone-500">Los factores se aplican en tiempo real a calculadora, scoring verde y propuestas CPQ.</div>
      </div>
    </Panel>
  </div>
)
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />)
</script>
</body>
</html>
