<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TRAZA//CO2 · CRM</title>
<meta name="description" content="CRM de consultoría TRAZA//CO2: trazabilidad de carbono y logística 5.0" />
<meta name="theme-color" content="#022c22" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
"imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
  "lucide-react": "https://esm.sh/lucide-react@0.451.0?external=react,react-dom",
  "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
}
}
</script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body class="bg-emerald-950">
<div id="root">
<div style="color:#d6d3d1;font-family:sans-serif;padding:40px;text-align:center">
  Cargando CRM TRAZA//CO2… (requiere conexión a internet la primera vez)
</div>
</div>

<script>
window.__crm_ok = false
window.addEventListener('error', function (e) {
if (window.__crm_ok) return
var r = document.getElementById('root')
if (r) r.innerHTML = '<div style="font-family:monospace;color:#fca5a5;padding:24px;white-space:pre-wrap">' +
  '❌ Error al arrancar: ' + (e.message || 'recurso bloqueado') + '<br>' +
  (e.filename || '') + ':' + (e.lineno || '') + '</div>'
})
window.addEventListener('unhandledrejection', function (e) {
if (window.__crm_ok) return
var r = document.getElementById('root')
if (r) r.innerHTML = '<div style="font-family:monospace;color:#fca5a5;padding:24px;white-space:pre-wrap">' +
  '❌ Fallo de red/CDN: ' + ((e.reason && e.reason.message) || e.reason) +
  '<br>Prueba en incógnito o borra caché (F12 → Application → Clear site data).</div>'
})
setTimeout(function () {
if (!window.__crm_ok) {
  var r = document.getElementById('root')
  if (r) r.insertAdjacentHTML('beforeend',
    '<div style="color:#fbbf24;text-align:center;font-family:sans-serif;padding:12px">⏳ Lleva más de 12 s cargando: Service Worker obsoleto (F12 → Application → Service Workers → Unregister) o CDN bloqueado.</div>')
}
}, 12000)
</script>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useEffect, useMemo, useState } from 'react'
import ReactDOM from 'react-dom/client'
import {
LayoutDashboard, Users, GitBranch, Calculator, Plus, ArrowLeft, ArrowRight,
Trash2, Leaf, TreePine, Car, Home, Building2, Search, CheckCircle2,
AlertTriangle, X
} from 'lucide-react'
import {
ResponsiveContainer, BarChart, Bar, XAxis, YAxis, CartesianGrid,
Tooltip, Legend, PieChart, Pie, Cell
} from 'recharts'

// ============ MARCA ============
function LogoIcon({ size = 42 }) {
return (
  <svg width={size} height={size} viewBox="0 0 64 64" fill="none">
    <path d="M9 15V9H34" stroke="#D2622A" strokeWidth="5" strokeLinecap="square" />
    <path d="M9 49V55H34" stroke="#D2622A" strokeWidth="5" strokeLinecap="square" />
    <rect x="15" y="17" width="7" height="30" rx="1" fill="#1F8A70" />
    <rect x="26" y="12" width="7" height="40" rx="1" fill="#1F8A70" />
    <rect x="37" y="22" width="7" height="18" rx="1" fill="#1F8A70" />
    <rect x="49" y="26" width="6" height="6" rx="1" fill="#1F8A70" />
    <rect x="49" y="36" width="6" height="6" rx="1" fill="#1F8A70" />
  </svg>
)
}
function Logo({ compact = false }) {
return (
  <div className="flex items-center gap-2">
    <LogoIcon size={compact ? 34 : 42} />
    <div className="leading-none">
      <div className="text-2xl font-black tracking-tight text-stone-100">
        TRAZA<span className="text-teal-400">//</span>CO<sub className="text-sm">2</sub>
      </div>
      {!compact && (
        <div className="text-xs font-bold text-orange-500 mt-1 tracking-widest">
          WMS · TRAZABILIDAD CARBONO · LOGÍSTICA 5.0
        </div>
      )}
    </div>
  </div>
)
}

// ============ UTILIDADES ============
const fmt = (n, d = 0) => (isNaN(n) ? 0 : n).toLocaleString('es-ES', { maximumFractionDigits: d })
const eur = (n) => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n || 0)

const FACTORES = {
diesel: 2.68, gasolina: 2.31, gasNatural: 2.02,
electricidad: 0.17, freight: 0.062, aereo: 0.115
}
const EQ = { arbol: 21.7, cocheKm: 0.12, hogar: 2000 }

const huellaKg = (b) =>
b.dieselL * FACTORES.diesel + b.gasolinaL * FACTORES.gasolina +
b.gasNatM3 * FACTORES.gasNatural + b.elecKWh * FACTORES.electricidad +
b.freightTkm * FACTORES.freight + b.aereoPkm * FACTORES.aereo
const huellaT = (b) => huellaKg(b) / 1000

// ============ DATOS SEMILLA ============
const TIPOS = ['Auditoría Flota Eléctrica', 'Última Milla Multimodal', 'Ingeniería de Empaques', 'Logística Inversa']
const STAGES = ['Prospecto', 'Calificación', 'Propuesta', 'Negociación', 'Ganado']
const COLORS = { 'Auditoría Flota Eléctrica': '#14b8a6', 'Última Milla Multimodal': '#f59e0b', 'Ingeniería de Empaques': '#84cc16', 'Logística Inversa': '#38bdf8' }

const CLIENTES0 = [
{ id: 1, nombre: 'Iberlogix Transportes', sector: 'Transporte', ciudad: 'Madrid', empleados: 210, flotaDiesel: true, iso14001: true, objetivo: 'Net Zero 2050', baseline: { dieselL: 180000, gasolinaL: 12000, gasNatM3: 0, elecKWh: 420000, freightTkm: 9500000, aereoPkm: 120000 } },
{ id: 2, nombre: 'EcoRetail España', sector: 'Gran Distribución', ciudad: 'Barcelona', empleados: 320, flotaDiesel: true, iso14001: true, objetivo: 'Net Zero 2030', baseline: { dieselL: 60000, gasolinaL: 4000, gasNatM3: 0, elecKWh: 1800000, freightTkm: 3200000, aereoPkm: 300000 } },
{ id: 3, nombre: 'Química Delta', sector: 'Industria', ciudad: 'Tarragona', empleados: 150, flotaDiesel: false, iso14001: false, objetivo: 'Reducción 2030', baseline: { dieselL: 8000, gasolinaL: 0, gasNatM3: 900000, elecKWh: 2600000, freightTkm: 900000, aereoPkm: 40000 } },
{ id: 4, nombre: 'Distribuciones Norte', sector: 'Distribución', ciudad: 'Bilbao', empleados: 80, flotaDiesel: true, iso14001: false, objetivo: 'ZBE 2026', baseline: { dieselL: 45000, gasolinaL: 6000, gasNatM3: 0, elecKWh: 180000, freightTkm: 1400000, aereoPkm: 20000 } },
{ id: 5, nombre: 'AgroSur Cooperativa', sector: 'Agroalimentario', ciudad: 'Valencia', empleados: 120, flotaDiesel: true, iso14001: true, objetivo: 'Huella 2030', baseline: { dieselL: 70000, gasolinaL: 0, gasNatM3: 120000, elecKWh: 350000, freightTkm: 2100000, aereoPkm: 0 } },
{ id: 6, nombre: 'FastPharma Logística', sector: 'Farmacéutico', ciudad: 'Zaragoza', empleados: 95, flotaDiesel: false, iso14001: true, objetivo: 'Net Zero 2040', baseline: { dieselL: 15000, gasolinaL: 0, gasNatM3: 40000, elecKWh: 900000, freightTkm: 800000, aereoPkm: 90000 } }
]

const DEALS0 = [
{ id: 1, cliente: 'Iberlogix Transportes', tipo: 'Auditoría Flota Eléctrica', stage: 'Propuesta', valor: 18500, score: 88, co2: 320 },
{ id: 2, cliente: 'Distribuciones Norte', tipo: 'Última Milla Multimodal', stage: 'Calificación', valor: 12000, score: 74, co2: 140 },
{ id: 3, cliente: 'EcoRetail España', tipo: 'Ingeniería de Empaques', stage: 'Prospecto', valor: 9500, score: 55, co2: 60 },
{ id: 4, cliente: 'FastPharma Logística', tipo: 'Logística Inversa', stage: 'Negociación', valor: 15800, score: 81, co2: 95 },
{ id: 5, cliente: 'EcoRetail España', tipo: 'Auditoría Flota Eléctrica', stage: 'Ganado', valor: 21000, score: 90, co2: 410 },
{ id: 6, cliente: 'AgroSur Cooperativa', tipo: 'Última Milla Multimodal', stage: 'Ganado', valor: 8900, score: 68, co2: 75 },
{ id: 7, cliente: 'Química Delta', tipo: 'Ingeniería de Empaques', stage: 'Calificación', valor: 11200, score: 65, co2: 85 },
{ id: 8, cliente: 'AgroSur Cooperativa', tipo: 'Logística Inversa', stage: 'Negociación', valor: 13400, score: 77, co2: 120 }
]

const LS_KEY = 'traza-co2-crm-v1'
const loadLS = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) } catch (e) { return null } }
const saveLS = (d) => { try { localStorage.setItem(LS_KEY, JSON.stringify(d)) } catch (e) {} }

// ============ COMPONENTES ============
const Card = ({ title, icon: Icon, children, right }) => (
<div className="bg-emerald-900/60 border border-emerald-800 rounded-xl p-4 flex flex-col gap-3">
  <div className="flex items-center justify-between">
    <div className="flex items-center gap-2 text-stone-100 font-semibold text-sm">
      {Icon && <Icon size={16} className="text-teal-400" />} {title}
    </div>
    {right}
  </div>
  {children}
</div>
)

function Kpi({ icon: Icon, label, value, sub, tone = 'text-teal-400' }) {
return (
  <div className="bg-emerald-900/60 border border-emerald-800 rounded-xl p-4">
    <div className="flex items-center gap-2 text-xs text-stone-400 uppercase tracking-wide"><Icon size={14} className={tone} /> {label}</div>
    <div className="text-2xl font-black text-stone-50 mt-1">{value}</div>
    {sub && <div className="text-xs text-stone-400 mt-1">{sub}</div>}
  </div>
)
}

const scoreColor = (s) => (s >= 80 ? 'text-teal-400' : s >= 65 ? 'text-amber-400' : 'text-orange-400')

// ---------- DASHBOARD ----------
function Dashboard({ deals, clientes }) {
const abiertos = deals.filter(d => d.stage !== 'Ganado')
const ganados = deals.filter(d => d.stage === 'Ganado')
const valorPipeline = abiertos.reduce((a, d) => a + d.valor, 0)
const co2Pot = abiertos.reduce((a, d) => a + d.co2, 0)

const stageData = STAGES.map(s => ({ stage: s, Valor: deals.filter(d => d.stage === s).reduce((a, d) => a + d.valor, 0) }))
const tipoData = TIPOS.map(t => ({ name: t, value: deals.filter(d => d.tipo === t).reduce((a, d) => a + d.valor, 0) })).filter(x => x.value > 0)
const huellaData = clientes
  .map(c => ({ name: c.nombre.split(' ')[0], Huella: +huellaT(c.baseline).toFixed(0) }))
  .sort((a, b) => b.Huella - a.Huella).slice(0, 6)

return (
  <div className="flex flex-col gap-4">
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
      <Kpi icon={GitBranch} label="Pipeline abierto" value={eur(valorPipeline)} sub={abiertos.length + ' oportunidades'} />
      <Kpi icon={CheckCircle2} label="Negocios ganados" value={ganados.length} sub={eur(ganados.reduce((a, d) => a + d.valor, 0)) + ' facturados'} tone="text-lime-400" />
      <Kpi icon={Leaf} label="CO₂ gestionable" value={fmt(co2Pot) + ' t'} sub="reducción potencial estimada" tone="text-teal-400" />
      <Kpi icon={Building2} label="Clientes activos" value={clientes.length} sub={clientes.filter(c => c.iso14001).length + ' con ISO 14001'} tone="text-orange-400" />
    </div>
    <div className="grid lg:grid-cols-2 gap-4">
      <Card title="Valor por etapa del pipeline" icon={GitBranch}>
        <div className="h-64 w-full">
          <ResponsiveContainer>
            <BarChart data={stageData}>
              <CartesianGrid strokeDasharray="3 3" stroke="#134e4a" />
              <XAxis dataKey="stage" stroke="#94a3b8" fontSize={10} />
              <YAxis stroke="#94a3b8" fontSize={10} tickFormatter={(v) => Math.round(v / 1000) + 'k'} />
              <Tooltip formatter={(v) => eur(v)} contentStyle={{ background: '#022c22', border: '1px solid #115e59', fontSize: 12 }} />
              <Bar dataKey="Valor" fill="#14b8a6" radius={[4, 4, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </Card>
      <Card title="Mix de servicios (valor)" icon={Calculator}>
        <div className="h-64 w-full">
          <ResponsiveContainer>
            <PieChart>
              <Pie data={tipoData} dataKey="value" nameKey="name" innerRadius={45} outerRadius={80} paddingAngle={3}>
                {tipoData.map((x, i) => <Cell key={i} fill={COLORS[x.name]} />)}
              </Pie>
              <Tooltip formatter={(v) => eur(v)} contentStyle={{ background: '#022c22', border: '1px solid #115e59', fontSize: 12 }} />
              <Legend wrapperStyle={{ fontSize: 11 }} />
            </PieChart>
          </ResponsiveContainer>
        </div>
      </Card>
    </div>
    <Card title="Huella de carbono por cliente (tCO₂e/año)" icon={Leaf}>
      <div className="h-64 w-full">
        <ResponsiveContainer>
          <BarChart layout="vertical" data={huellaData}>
            <CartesianGrid strokeDasharray="3 3" stroke="#134e4a" />
            <XAxis type="number" stroke="#94a3b8" fontSize={10} />
            <YAxis type="category" dataKey="name" stroke="#94a3b8" fontSize={11} width={90} />
            <Tooltip formatter={(v) => v + ' tCO₂e'} contentStyle={{ background: '#022c22', border: '1px solid #115e59', fontSize: 12 }} />
            <Bar dataKey="Huella" fill="#84cc16" radius={[0, 4, 4, 0]} />
          </BarChart>
        </ResponsiveContainer>
      </div>
    </Card>
  </div>
)
}

// ---------- PIPELINE ----------
function Pipeline({ deals, setDeals }) {
const [nuevo, setNuevo] = useState({ cliente: '', tipo: TIPOS[0], stage: STAGES[0], valor: 0, score: 50, co2: 0 })
const [clientes] = useState(CLIENTES0)

const mover = (id, dir) => setDeals(prev => prev.map(d => {
  if (d.id !== id) return d
  const i = Math.min(STAGES.length - 1, Math.max(0, STAGES.indexOf(d.stage) + dir))
  return { ...d, stage: STAGES[i] }
}))
const borrar = (id) => setDeals(prev => prev.filter(d => d.id !== id))
const agregar = () => {
  if (!nuevo.cliente || !nuevo.valor) return
  setDeals(prev => [...prev, { id: Date.now(), ...nuevo, valor: +nuevo.valor, score: +nuevo.score, co2: +nuevo.co2 }])
  setNuevo({ ...nuevo, valor: 0, score: 50, co2: 0 })
}

return (
  <div className="flex flex-col gap-4">
    <Card title="Nueva oportunidad" icon={Plus}>
      <div className="grid grid-cols-2 lg:grid-cols-6 gap-2 text-xs">
        <select value={nuevo.cliente} onChange={(e) => setNuevo({ ...nuevo, cliente: e.target.value })} className="bg-emerald-950 border border-emerald-700 rounded-lg px-2 py-2">
          <option value="">— Cliente —</option>
          {clientes.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
        </select>
        <select value={nuevo.tipo} onChange={(e) => setNuevo({ ...nuevo, tipo: e.target.value })} className="bg-emerald-950 border border-emerald-700 rounded-lg px-2 py-2">
          {TIPOS.map(t => <option key={t}>{t}</option>)}
        </select>
        <select value={nuevo.stage} onChange={(e) => setNuevo({ ...nuevo, stage: e.target.value })} className="bg-emerald-950 border border-emerald-700 rounded-lg px-2 py-2">
          {STAGES.map(s => <option key={s}>{s}</option>)}
        </select>
        <input type="number" placeholder="Valor €" value={nuevo.valor || ''} onChange={(e) => setNuevo({ ...nuevo, valor: e.target.value })} className="bg-emerald-950 border border-emerald-700 rounded-lg px-2 py-2" />
        <input type="number" placeholder="Score 0-100" value={nuevo.score} onChange={(e) => setNuevo({ ...nuevo, score: e.target.value })} className="bg-emerald-950 border border-emerald-700 rounded-lg px-2 py-2" />
        <button onClick={agregar} className="bg-teal-500 hover:bg-teal-400 text-emerald-950 font-bold rounded-lg px-2 py-2 flex items-center justify-center gap-1"><Plus size={13} /> Añadir</button>
      </div>
    </Card>

    <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-3">
      {STAGES.map(s => {
        const col = deals.filter(d => d.stage === s)
        return (
          <div key={s} className="bg-emerald-900/40 border border-emerald-800 rounded-xl p-2 flex flex-col gap-2">
            <div className="flex items-center justify-between px-1">
              <span className="text-xs font-bold text-stone-300 uppercase">{s}</span>
              <span className="text-xs text-teal-400 font-bold">{col.reduce((a, d) => a + d.valor, 0) / 1000}k€</span>
            </div>
            {col.map(d => (
              <div key={d.id} className="bg-emerald-950 border border-emerald-800 rounded-lg p-2 text-xs flex flex-col gap-1" style={{ borderLeft: '3px solid ' + COLORS[d.tipo] }}>
                <div className="font-bold text-stone-100">{d.cliente}</div>
                <div className="text-stone-400">{d.tipo}</div>
                <div className="flex justify-between items-center">
                  <span className="font-bold text-stone-100">{eur(d.valor)}</span>
                  <span className={scoreColor(d.score) + ' font-bold'}>Score {d.score}</span>
                </div>
                <div className="flex items-center gap-1 text-lime-400"><Leaf size={11} /> {d.co2} tCO₂e evitables</div>
                {d.score < 60 && <div className="text-orange-400 flex items-center gap-1"><AlertTriangle size={11} /> requiere seguimiento</div>}
                <div className="flex gap-1 mt-1">
                  <button onClick={() => mover(d.id, -1)} disabled={s === STAGES[0]} className="flex-1 bg-emerald-900 disabled:opacity-30 hover:bg-emerald-800 rounded py-1"><ArrowLeft size={12} className="mx-auto" /></button>
                  <button onClick={() => borrar(d.id)} className="bg-emerald-900 hover:bg-red-900 rounded px-2"><Trash2 size={12} className="text-orange-400" /></button>
                  <button onClick={() => mover(d.id, 1)} disabled={s === STAGES[STAGES.length - 1]} className="flex-1 bg-emerald-900 disabled:opacity-30 hover:bg-emerald-800 rounded py-1"><ArrowRight size={12} className="mx-auto" /></button>
                </div>
              </div>
            ))}
            {col.length === 0 && <div className="text-stone-600 text-xs text-center py-4">vacío</div>}
          </div>
        )
      })}
    </div>
  </div>
)
}

// ---------- CLIENTES ----------
function Clientes({ clientes, setClientes, onCalcular }) {
const [q, setQ] = useState('')
const [sel, setSel] = useState(null)
const lista = clientes.filter(c => (c.nombre + c.sector + c.ciudad).toLowerCase().includes(q.toLowerCase()))
const detail = clientes.find(c => c.id === sel)

return (
  <div className="flex flex-col gap-4">
    <div className="relative">
      <Search size={15} className="absolute left-3 top-3 text-stone-500" />
      <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Buscar cliente, sector o ciudad…" className="w-full bg-emerald-900/60 border border-emerald-700 rounded-xl pl-9 pr-3 py-2.5 text-sm text-stone-100" />
    </div>
    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
      {lista.map(c => {
        const t = huellaT(c.baseline)
        return (
          <button key={c.id} onClick={() => setSel(c.id)} className={'text-left bg-emerald-900/60 border rounded-xl p-4 flex flex-col gap-2 hover:border-teal-400 ' + (sel === c.id ? 'border-teal-400' : 'border-emerald-800')}>
            <div className="flex items-center justify-between">
              <span className="font-bold text-stone-100">{c.nombre}</span>
              {c.iso14001 && <span className="text-xs bg-teal-950 text-teal-400 border border-teal-700 rounded px-1.5 py-0.5">ISO 14001</span>}
            </div>
            <div className="text-xs text-stone-400">{c.sector} · {c.ciudad} · {c.empleados} empleados</div>
            <div className="text-xs text-stone-400">Objetivo: <span className="text-orange-400 font-semibold">{c.objetivo}</span></div>
            <div className="flex items-center gap-1 text-sm font-bold text-lime-400"><Leaf size={14} /> {fmt(t)} tCO₂e/año</div>
            <div className="flex gap-1 text-xs text-stone-500">
              {c.flotaDiesel ? <span className="text-orange-400">Flota diésel</span> : <span className="text-teal-400">Flota sin diésel</span>}
            </div>
          </button>
        )
      })}
    </div>

    {detail && (
      <Card title={'Detalle · ' + detail.nombre} icon={Building2}
        right={<button onClick={() => setSel(null)} className="text-stone-400 hover:text-stone-100"><X size={16} /></button>}>
        <div className="grid grid-cols-2 lg:grid-cols-6 gap-2 text-xs">
          {[['Diésel (L)', detail.baseline.dieselL], ['Gasolina (L)', detail.baseline.gasolinaL], ['Gas nat. (m³)', detail.baseline.gasNatM3], ['Elec. (kWh)', detail.baseline.elecKWh], ['Freight (tkm)', detail.baseline.freightTkm], ['Aéreo (pkm)', detail.baseline.aereoPkm]].map(([l, v]) => (
            <div key={l} className="bg-emerald-950 border border-emerald-800 rounded-lg p-2"><div className="text-stone-500">{l}</div><div className="text-stone-100 font-bold">{fmt(v)}</div></div>
          ))}
        </div>
        <div className="grid grid-cols-3 gap-2 text-xs">
          <div className="bg-lime-950/40 border border-lime-800 rounded-lg p-2 text-center"><TreePine size={14} className="mx-auto text-lime-400" /><div className="font-bold text-stone-100 mt-1">{fmt(huellaKg(detail.baseline) / EQ.arbol)}</div><div className="text-stone-500">árboles/año eq.</div></div>
          <div className="bg-orange-950/40 border border-orange-800 rounded-lg p-2 text-center"><Car size={14} className="mx-auto text-orange-400" /><div className="font-bold text-stone-100 mt-1">{fmt(huellaKg(detail.baseline) / EQ.cocheKm)} km</div><div className="text-stone-500">en coche eq.</div></div>
          <div className="bg-teal-950/40 border border-teal-800 rounded-lg p-2 text-center"><Home size={14} className="mx-auto text-teal-400" /><div className="font-bold text-stone-100 mt-1">{fmt(huellaKg(detail.baseline) / EQ.hogar)}</div><div className="text-stone-500">hogares eq.</div></div>
        </div>
        <div className="flex gap-2">
          <button onClick={() => onCalcular(detail)} className="bg-teal-500 hover:bg-teal-400 text-emerald-950 font-bold rounded-lg px-3 py-2 text-xs flex items-center gap-1"><Calculator size={13} /> Abrir en calculadora</button>
          <button onClick={() => { setClientes(prev => prev.filter(c => c.id !== detail.id)); setSel(null) }} className="bg-stone-800 hover:bg-red-900 text-stone-300 rounded-lg px-3 py-2 text-xs flex items-center gap-1"><Trash2 size={13} /> Eliminar</button>
        </div>
      </Card>
    )}
  </div>
)
}

// ---------- CALCULADORA ----------
const BASE0 = { dieselL: 0, gasolinaL: 0, gasNatM3: 0, elecKWh: 0, freightTkm: 0, aereoPkm: 0 }
function Calculadora({ clientes, onGuardar, inicial, setInicial }) {
const [b, setB] = useState(BASE0)
const [cli, setCli] = useState('')

useEffect(() => {
  if (inicial) { setB(inicial.baseline); setCli(inicial.nombre); setInicial(null) }
}, [inicial])

const kg = huellaKg(b)
const t = kg / 1000
const set = (k, v) => setB({ ...b, [k]: +v })
const breakdown = [
  { name: 'Diésel', kg: b.dieselL * FACTORES.diesel }, { name: 'Gasolina', kg: b.gasolinaL * FACTORES.gasolina },
  { name: 'Gas natural', kg: b.gasNatM3 * FACTORES.gasNatural }, { name: 'Electricidad', kg: b.elecKWh * FACTORES.electricidad },
  { name: 'Freight', kg: b.freightTkm * FACTORES.freight }, { name: 'Aéreo', kg: b.aereoPkm * FACTORES.aereo }
].map(x => ({ ...x, kg: +(x.kg / 1000).toFixed(1) }))

return (
  <div className="grid lg:grid-cols-2 gap-4">
    <Card title="Calculadora de huella (alcance 1+2+3)" icon={Calculator}>
      <select value={cli} onChange={(e) => {
        setCli(e.target.value)
        const c = clientes.find(x => x.nombre === e.target.value)
        if (c) setB(c.baseline)
      }} className="bg-emerald-950 border border-emerald-700 rounded-lg px-2 py-2 text-xs">
        <option value="">— Cargar baseline de cliente —</option>
        {clientes.map(c => <option key={c.id}>{c.nombre}</option>)}
      </select>
      <div className="grid grid-cols-2 gap-2 text-xs">
        {[['dieselL', 'Diésel (litros)'], ['gasolinaL', 'Gasolina (litros)'], ['gasNatM3', 'Gas natural (m³)'], ['elecKWh', 'Electricidad (kWh)'], ['freightTkm', 'Freight (ton·km)'], ['aereoPkm', 'Aéreo (pas·km)']].map(([k, l]) => (
          <label key={k} className="flex flex-col gap-1"><span className="text-stone-400">{l}</span>
            <input type="number" value={b[k]} onChange={(e) => set(k, e.target.value)} className="bg-emerald-950 border border-emerald-700 rounded-lg px-2 py-2 text-stone-100" />
          </label>
        ))}
      </div>
      <div className="bg-emerald-950 border border-teal-700 rounded-xl p-4 text-center">
        <div className="text-xs text-stone-400 uppercase">Huella estimada</div>
        <div className="text-3xl font-black text-lime-400">{fmt(t, 1)} tCO₂e/año</div>
        <button onClick={() => cli && onGuardar(cli, b)} disabled={!cli} className="mt-2 bg-teal-500 disabled:opacity-40 hover:bg-teal-400 text-emerald-950 font-bold rounded-lg px-4 py-2 text-xs">Guardar como baseline de {cli || 'cliente'}</button>
      </div>
    </Card>
    <div className="flex flex-col gap-4">
      <Card title="Desglose por fuente (tCO₂e)" icon={Leaf}>
        <div className="h-56 w-full">
          <ResponsiveContainer>
            <BarChart data={breakdown}>
              <CartesianGrid strokeDasharray="3 3" stroke="#134e4a" />
              <XAxis dataKey="name" stroke="#94a3b8" fontSize={10} />
              <YAxis stroke="#94a3b8" fontSize={10} />
              <Tooltip formatter={(v) => v + ' t'} contentStyle={{ background: '#022c22', border: '1px solid #115e59', fontSize: 12 }} />
              <Bar dataKey="kg" name="tCO₂e" fill="#14b8a6" radius={[4, 4, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </Card>
      <Card title="Equivalencias" icon={TreePine}>
        <div className="grid grid-cols-3 gap-2 text-xs">
          <div className="bg-lime-950/40 border border-lime-800 rounded-lg p-3 text-center"><TreePine size={16} className="mx-auto text-lime-400" /><div className="font-bold text-stone-100 mt-1">{fmt(kg / EQ.arbol)}</div><div className="text-stone-500">árboles/año absorben lo mismo</div></div>
          <div className="bg-orange-950/40 border border-orange-800 rounded-lg p-3 text-center"><Car size={16} className="mx-auto text-orange-400" /><div className="font-bold text-stone-100 mt-1">{fmt(kg / EQ.cocheKm)} km</div><div className="text-stone-500">equivalen a coche medio</div></div>
          <div className="bg-teal-950/40 border border-teal-800 rounded-lg p-3 text-center"><Home size={16} className="mx-auto text-teal-400" /><div className="font-bold text-stone-100 mt-1">{fmt(kg / EQ.hogar)}</div><div className="text-stone-500">hogares medios al año</div></div>
        </div>
      </Card>
    </div>
  </div>
)
}

// ---------- APP ----------
export default function App() {
const saved = loadLS()
const [tab, setTab] = useState('dash')
const [clientes, setClientes] = useState(saved && saved.clientes ? saved.clientes : CLIENTES0)
const [deals, setDeals] = useState(saved && saved.deals ? saved.deals : DEALS0)
const [inicial, setInicial] = useState(null)

useEffect(() => { saveLS({ clientes, deals }) }, [clientes, deals])
const irACalculadora = (c) => { setInicial(c); setTab('calc') }
const guardarBaseline = (nombre, b) => setClientes(prev => prev.map(c => c.nombre === nombre ? { ...c, baseline: b } : c))

const NAV = [
  { id: 'dash', label: 'Dashboard', icon: LayoutDashboard },
  { id: 'pipe', label: 'Pipeline', icon: GitBranch },
  { id: 'cli', label: 'Clientes', icon: Users },
  { id: 'calc', label: 'Calculadora CO₂', icon: Calculator },
]

return (
  <div className="min-h-screen text-stone-100 p-4 sm:p-6 font-sans">
    <header className="flex flex-wrap items-center gap-3 bg-emerald-900/60 border border-emerald-800 rounded-2xl p-4 mb-4">
      <Logo />
      <div className="ml-auto text-xs text-stone-400">Propietario: <span className="text-stone-200 font-medium">Miguel Ángel Layunta López</span></div>
    </header>
    <nav className="flex flex-wrap gap-2 mb-4">
      {NAV.map(t => (
        <button key={t.id} onClick={() => setTab(t.id)} className={'flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-medium border ' + (tab === t.id ? 'bg-teal-500 text-emerald-950 border-teal-400 font-bold' : 'bg-emerald-900/60 text-stone-300 border-emerald-800 hover:border-teal-400')}>
          <t.icon size={14} /> {t.label}
        </button>
      ))}
    </nav>
    {tab === 'dash' && <Dashboard deals={deals} clientes={clientes} />}
    {tab === 'pipe' && <Pipeline deals={deals} setDeals={setDeals} />}
    {tab === 'cli' && <Clientes clientes={clientes} setClientes={setClientes} onCalcular={irACalculadora} />}
    {tab === 'calc' && <Calculadora clientes={clientes} onGuardar={guardarBaseline} inicial={inicial} setInicial={setInicial} />}
    <footer className="mt-8 text-center text-xs text-stone-600">TRAZA//CO2 · Trazabilidad Carbono · Logística 5.0 — mlayuntalopez@gmail.com · 698 910 833</footer>
  </div>
)
}

const root = ReactDOM.createRoot(document.getElementById('root'))
root.render(<App />)
window.__crm_ok = true
</script>

if ('serviceWorker' in navigator) {
window.addEventListener('load', function () {
  navigator.serviceWorker.register('./sw.js').catch(function (err) { console.warn('SW no registrado:', err) })
})
}
</script>
</body>
</html>
